<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote - Veritas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #09090b;
            color: white;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-btn.active {
            border-bottom: 2px solid #6366f1;
            color: #6366f1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Modal Transitions */
        #settings-modal {
            transition: opacity 0.3s ease;
        }

        #settings-sheet {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1);
        }

        .modal-hidden #settings-modal {
            opacity: 0;
            pointer-events: none;
        }

        .modal-hidden #settings-sheet {
            transform: translateY(100%);
        }

        /* Light Mode Inversion Strategy */
        html.light {
            filter: invert(1) hue-rotate(180deg);
        }
        html.light img, html.light video, html.light svg.no-invert {
            filter: invert(1) hue-rotate(180deg);
        }
        /* Fix the backdrop blur background when inverted */
        html.light #settings-modal {
            background-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body class="h-screen flex flex-col relative overflow-hidden">
    <!-- Header -->
    <header
        class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950/80 backdrop-blur sticky top-0 z-10">
        <h1 class="text-xl font-bold text-blue-500">Veritas Remote</h1>
        <div class="flex items-center gap-3">
            <div id="status" class="text-xs font-medium px-2 py-1 bg-zinc-800 text-zinc-400 rounded-full">Connecting...
            </div>
            <button onclick="toggleLightMode()"
                class="text-zinc-400 hover:text-white p-2 rounded-full hover:bg-zinc-800 transition-colors active:scale-95" title="Toggle Light Mode">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="no-invert">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
            <button onclick="toggleSettings()"
                class="text-zinc-400 hover:text-white p-2 rounded-full hover:bg-zinc-800 transition-colors active:scale-95">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="no-invert">
                    <circle cx="12" cy="12" r="1" />
                    <circle cx="12" cy="5" r="1" />
                    <circle cx="12" cy="19" r="1" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Settings Modal -->
    <div id="settings-wrapper" class="modal-hidden">
        <div id="settings-modal" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm" onclick="toggleSettings()">
        </div>
        <div id="settings-sheet"
            class="fixed bottom-0 left-0 right-0 z-[100] bg-zinc-950/95 backdrop-blur-xl border-t border-zinc-800/80 rounded-t-[2.5rem] p-6 pb-12 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] max-h-[85vh] flex flex-col">
            <div class="w-12 h-1.5 bg-zinc-800 rounded-full mx-auto mb-6 shrink-0"></div>

            <div class="flex gap-2 bg-zinc-900 p-1 rounded-xl mb-6 shrink-0">
                <button onclick="switchSettingsTab('theme')" id="s-tab-theme"
                    class="flex-1 py-2 text-sm font-bold rounded-lg bg-zinc-700 text-white shadow-sm transition-all">Theme</button>
                <button onclick="switchSettingsTab('history')" id="s-tab-history"
                    class="flex-1 py-2 text-sm font-bold rounded-lg text-zinc-400 hover:text-zinc-200 transition-all">History</button>
            </div>

            <div id="s-content-theme" class="flex-1 overflow-y-auto min-h-0 space-y-6 pb-8">
                <!-- Theme Controls -->
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between mb-2"><label
                                class="text-sm font-medium text-zinc-300">Background Dimming</label><span id="val-dim"
                                class="text-xs text-blue-400 font-mono"></span></div>
                        <input type="range" id="input-dim" min="0" max="100"
                            onchange="updateTheme('bgDim', parseInt(this.value))"
                            oninput="document.getElementById('val-dim').innerText=this.value+'%'"
                            class="w-full accent-blue-500">
                    </div>
                    <div>
                        <div class="flex justify-between mb-2"><label
                                class="text-sm font-medium text-zinc-300">Background Blur</label><span id="val-blur"
                                class="text-xs text-blue-400 font-mono"></span></div>
                        <input type="range" id="input-blur" min="0" max="20"
                            onchange="updateTheme('bgBlur', parseInt(this.value))"
                            oninput="document.getElementById('val-blur').innerText=this.value+'px'"
                            class="w-full accent-blue-500">
                    </div>
                    <div>
                        <div class="flex justify-between mb-2"><label class="text-sm font-medium text-zinc-300">Primary Font Size</label><span id="val-fontsize" class="text-xs text-blue-400 font-mono"></span></div>
                        <input type="range" id="input-fontsize" min="20" max="200"
                            onchange="updateTheme('mainFontSize', parseInt(this.value))"
                            oninput="document.getElementById('val-fontsize').innerText=this.value+'px'"
                            class="w-full accent-blue-500">
                    </div>
                    <div>
                        <div class="flex justify-between mb-2"><label class="text-sm font-medium text-zinc-300">Secondary Font Size</label><span id="val-subfontsize" class="text-xs text-blue-400 font-mono"></span></div>
                        <input type="range" id="input-subfontsize" min="20" max="200"
                            onchange="updateTheme('subFontSize', parseInt(this.value))"
                            oninput="document.getElementById('val-subfontsize').innerText=this.value+'px'"
                            class="w-full accent-blue-500">
                    </div>
                    <div>
                        <label class="text-sm font-medium text-zinc-300 mb-2 block">Text Alignment</label>
                        <select id="input-align" onchange="updateTheme('textAlign', this.value)"
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500">
                            <option value="left">Left</option>
                            <option value="center">Center</option>
                            <option value="right">Right</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-zinc-300 mb-2 block">Font Family</label>
                        <select id="input-font" onchange="updateTheme('mainFontFamily', this.value)"
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500">
                            <option value="sans-serif">Sans Serif</option>
                            <option value="ui-sans-serif, system-ui, sans-serif">System</option>
                            <option value="'Playfair Display', serif">Playfair Display</option>
                            <option value="'Montserrat', sans-serif">Montserrat</option>
                            <option value="'Outfit', sans-serif">Outfit</option>
                            <option value="'Poppins', sans-serif">Poppins</option>
                            <option value="'Hind', sans-serif">Hind</option>
                            <option value="'Tiro Devanagari Hindi', serif">Tiro Devanagari</option>
                            <option value="'Inter', sans-serif">Inter</option>
                            <option value="'Noto Sans', sans-serif">Noto Sans</option>
                            <option value="'Baloo 2', sans-serif">Baloo</option>
                            <option value="'Georgia', serif">Georgia</option>
                        </select>
                    </div>
                    <div>
                        <div class="flex justify-between mb-2"><label class="text-sm font-medium text-zinc-300">Padding</label><span id="val-padding" class="text-xs text-blue-400 font-mono"></span></div>
                        <input type="range" id="input-padding" min="0" max="50"
                            onchange="updateTheme('padding', parseInt(this.value))"
                            oninput="document.getElementById('val-padding').innerText=this.value+'px'"
                            class="w-full accent-blue-500">
                    </div>
                    <div>
                        <div class="flex justify-between mb-2"><label class="text-sm font-medium text-zinc-300">Top Margin</label><span id="val-margin" class="text-xs text-blue-400 font-mono"></span></div>
                        <input type="range" id="input-margin" min="-100" max="100"
                            onchange="updateTheme('margin', parseInt(this.value))"
                            oninput="document.getElementById('val-margin').innerText=this.value+'px'"
                            class="w-full accent-blue-500">
                    </div>
                    <div>
                        <div class="flex justify-between mb-2"><label class="text-sm font-medium text-zinc-300">Text Gap</label><span id="val-gap" class="text-xs text-blue-400 font-mono"></span></div>
                        <input type="range" id="input-gap" min="-100" max="100"
                            onchange="updateTheme('translationSpacing', parseInt(this.value))"
                            oninput="document.getElementById('val-gap').innerText=this.value+'px'"
                            class="w-full accent-blue-500">
                    </div>
                    <div>
                        <div class="flex justify-between mb-2"><label class="text-sm font-medium text-zinc-300">Line Height</label><span id="val-lineheight" class="text-xs text-blue-400 font-mono"></span></div>
                        <input type="range" id="input-lineheight" min="5" max="30" step="1"
                            onchange="updateTheme('lineHeight', parseInt(this.value) / 10)"
                            oninput="document.getElementById('val-lineheight').innerText=(parseInt(this.value)/10).toFixed(1)"
                            class="w-full accent-blue-500">
                    </div>
                </div>
            </div>

            <div id="s-content-history" class="hidden flex-1 overflow-y-auto min-h-0 pb-8 space-y-2">
                <div id="history-container" class="space-y-2">
                    <div class="text-zinc-500 text-sm italic text-center mt-8">No history available</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabs (Main) -->
    <div class="flex border-b border-zinc-800 bg-zinc-900">
        <button onclick="switchTab('live')" id="tab-live"
            class="tab-btn active flex-1 py-3 text-sm font-semibold text-zinc-400 uppercase tracking-wider transition-colors">Live</button>
        <button onclick="switchTab('search')" id="tab-search"
            class="tab-btn flex-1 py-3 text-sm font-semibold text-zinc-400 uppercase tracking-wider transition-colors">Search</button>
    </div>

    <!-- Live Tab -->
    <div id="content-live" class="tab-content active flex-1 overflow-y-auto pb-32">
        <!-- Preview -->
        <div class="p-4">
            <div
                class="bg-zinc-900/50 backdrop-blur-md border border-zinc-800/80 rounded-2xl p-6 text-center min-h-[160px] flex flex-col justify-center items-center shadow-2xl relative ring-1 ring-white/5">
                <div id="preview-title"
                    class="text-xs font-bold text-blue-400 mb-3 uppercase tracking-widest drop-shadow-sm"></div>
                <div id="preview-text"
                    class="text-2xl font-bold mb-3 break-words max-w-full leading-tight drop-shadow-md">...</div>
                <div id="preview-subtext"
                    class="text-lg text-zinc-400 break-words max-w-full leading-snug drop-shadow-sm"></div>
            </div>
        </div>

        <!-- Playlist -->
        <div class="px-4">
            <h2 class="text-xs uppercase font-bold text-zinc-500 tracking-wider mb-3 px-1">Playlist</h2>
            <div id="playlist-container" class="space-y-2">
                <div class="text-zinc-500 text-sm italic px-1">No playlist loaded</div>
            </div>
        </div>
    </div>

    <!-- Search Tab -->
    <div id="content-search" class="tab-content flex-1 overflow-y-auto bg-zinc-950 pb-32">
        <div class="p-4 sticky top-0 bg-zinc-950/90 backdrop-blur border-b border-zinc-800 z-10 flex flex-col gap-3">
            <div class="flex bg-zinc-900 rounded-lg p-1 gap-1">
                <button id="search-type-song" type="button" onclick="setSearchType('song')"
                    class="flex-1 py-1.5 text-sm font-bold rounded-md bg-zinc-700 text-white shadow-sm transition-all">Songs</button>
                <button id="search-type-bible" type="button" onclick="setSearchType('bible')"
                    class="flex-1 py-1.5 text-sm font-bold rounded-md text-zinc-400 hover:text-zinc-200 transition-all">Bible</button>
            </div>
            <form onsubmit="performSearch(event)" class="flex gap-2">
                <input type="text" id="search-input" placeholder="Search songs..."
                    class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500 transition-colors">
                <button type="submit"
                    class="bg-blue-600 active:bg-blue-500 px-6 rounded-xl font-bold shadow text-white">Go</button>
            </form>
        </div>
        <div id="search-results" class="p-4 space-y-2">
            <div class="text-zinc-500 text-sm italic text-center mt-8">Search for a song to display results</div>
        </div>
    </div>

    <!-- Fixed Bottom Action Bar -->
    <div
        class="fixed bottom-0 left-0 right-0 p-4 pb-8 bg-zinc-950/80 backdrop-blur-xl border-t border-zinc-800/80 grid grid-cols-[1fr_1.5fr_1fr] gap-3 z-50 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
        <button onclick="sendCommand('prev')"
            class="bg-zinc-800/80 hover:bg-zinc-700 active:bg-zinc-600 py-3 rounded-2xl font-bold flex flex-col items-center justify-center gap-1 transition-all active:scale-95 border border-zinc-700/50 text-zinc-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                class="opacity-80">
                <path d="m15 18-6-6 6-6" />
            </svg>
            <span class="text-[10px] uppercase tracking-widest opacity-70">Prev</span>
        </button>
        <button onclick="sendCommand('clear')"
            class="bg-rose-500/10 hover:bg-rose-500/20 active:bg-rose-500/30 py-3 rounded-2xl font-bold flex flex-col items-center justify-center gap-1 transition-all active:scale-95 border border-rose-500/20 text-rose-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                class="opacity-80">
                <rect width="20" height="14" x="2" y="3" rx="2" />
                <line x1="8" x2="16" y1="21" y2="21" />
                <line x1="12" x2="12" y1="17" y2="21" />
                <line x1="3" x2="21" y1="3" y2="21" />
            </svg>
            <span class="text-[10px] uppercase tracking-widest opacity-80">Clear</span>
        </button>
        <button onclick="sendCommand('next')"
            class="bg-blue-600 hover:bg-blue-500 active:bg-blue-400 py-3 rounded-2xl font-bold flex flex-col items-center justify-center gap-1 transition-all active:scale-95 shadow-[0_0_20px_rgba(79,70,229,0.3)] border border-blue-500/50 text-white">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 18 6-6-6-6" />
            </svg>
            <span class="text-[10px] uppercase tracking-widest opacity-90">Next</span>
        </button>
    </div>

    <script>
        let ws;
        let globalHistory = [];
        let globalTheme = {};

        // Light Mode Initialization
        if (localStorage.getItem('veritas_remote_light') === 'true') {
            document.documentElement.classList.add('light');
        }

        function toggleLightMode() {
            document.documentElement.classList.toggle('light');
            const isLight = document.documentElement.classList.contains('light');
            localStorage.setItem('veritas_remote_light', isLight ? 'true' : 'false');
        }

        function toggleSettings() {
            document.getElementById('settings-wrapper').classList.toggle('modal-hidden');
        }

        function switchSettingsTab(tab) {
            const themeBtn = document.getElementById('s-tab-theme');
            const historyBtn = document.getElementById('s-tab-history');
            const themeContent = document.getElementById('s-content-theme');
            const historyContent = document.getElementById('s-content-history');

            if (tab === 'theme') {
                themeBtn.className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-zinc-700 text-white shadow-sm transition-all';
                historyBtn.className = 'flex-1 py-2 text-sm font-bold rounded-lg text-zinc-400 hover:text-zinc-200 transition-all';
                themeContent.classList.remove('hidden');
                historyContent.classList.add('hidden');
            } else {
                historyBtn.className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-zinc-700 text-white shadow-sm transition-all';
                themeBtn.className = 'flex-1 py-2 text-sm font-bold rounded-lg text-zinc-400 hover:text-zinc-200 transition-all';
                historyContent.classList.remove('hidden');
                themeContent.classList.add('hidden');
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'text-blue-400'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.getElementById(`tab-${tab}`).classList.add('active', 'text-blue-400');
            document.getElementById(`content-${tab}`).classList.add('active');
        }

        function updateTheme(key, value) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'set_theme', theme: { [key]: value } }));
            }
        }

        function connect() {
            ws = new WebSocket(`ws://${window.location.host}/ws`);
            const status = document.getElementById('status');

            ws.onopen = () => {
                status.textContent = 'Connected';
                status.classList.remove('bg-zinc-800', 'text-zinc-400', 'bg-rose-900/50', 'text-rose-400');
                status.classList.add('bg-emerald-900/50', 'text-emerald-400');
                ws.send(JSON.stringify({ action: 'get_state' }));
            };
            ws.onclose = () => {
                status.textContent = 'Disconnected';
                status.classList.remove('bg-emerald-900/50', 'text-emerald-400', 'bg-zinc-800', 'text-zinc-400');
                status.classList.add('bg-rose-900/50', 'text-rose-400');
                setTimeout(connect, 1000);
            };

            ws.onmessage = (event) => {
                let data;
                try { data = JSON.parse(event.data); } catch (e) { return; }

                if (data.type === 'search_results') {
                    renderSearchResults(data.results);
                } else if (data.type === 'search_results_bible') {
                    renderBibleResults(data.results);
                } else if (data.text !== undefined || data.isBlackout !== undefined) {
                    // SlideState payload
                    if (data.isBlackout) {
                        document.getElementById('preview-title').textContent = '';
                        document.getElementById('preview-text').textContent = '[ SCREEN CLEARED ]';
                        document.getElementById('preview-subtext').textContent = '';
                    } else {
                        document.getElementById('preview-title').textContent = data.title || '';
                        document.getElementById('preview-text').textContent = data.text || 'No active slide';
                        document.getElementById('preview-subtext').textContent = data.subtext || '';
                    }

                    if (data.playlist) {
                        renderPlaylist(data.playlist, data.slideIndex);
                    }
                    if (data.history) {
                        globalHistory = data.history;
                        renderHistory();
                    }
                    if (data.theme) {
                        globalTheme = data.theme;
                        document.getElementById('input-dim').value = data.theme.bgDim || 0;
                        document.getElementById('val-dim').innerText = (data.theme.bgDim || 0) + '%';
                        document.getElementById('input-blur').value = data.theme.bgBlur || 0;
                        document.getElementById('val-blur').innerText = (data.theme.bgBlur || 0) + 'px';
                        document.getElementById('input-fontsize').value = data.theme.mainFontSize || 90;
                        document.getElementById('val-fontsize').innerText = (data.theme.mainFontSize || 90) + 'px';
                        document.getElementById('input-subfontsize').value = data.theme.subFontSize || 40;
                        document.getElementById('val-subfontsize').innerText = (data.theme.subFontSize || 40) + 'px';
                        
                        document.getElementById('input-padding').value = data.theme.padding || 0;
                        document.getElementById('val-padding').innerText = (data.theme.padding || 0) + 'px';
                        document.getElementById('input-margin').value = data.theme.margin || 0;
                        document.getElementById('val-margin').innerText = (data.theme.margin || 0) + 'px';
                        document.getElementById('input-gap').value = data.theme.translationSpacing || 0;
                        document.getElementById('val-gap').innerText = (data.theme.translationSpacing || 0) + 'px';
                        document.getElementById('input-lineheight').value = (data.theme.lineHeight || 1.2) * 10;
                        document.getElementById('val-lineheight').innerText = (data.theme.lineHeight || 1.2).toFixed(1);

                        document.getElementById('input-align').value = data.theme.textAlign || 'center';
                        
                        // Set the value only if the option exists to avoid resetting custom fonts unexpectedly
                        const fontSelect = document.getElementById('input-font');
                        const fontValue = data.theme.mainFontFamily || 'sans-serif';
                        let fontExists = Array.from(fontSelect.options).some(opt => opt.value === fontValue);
                        if (!fontExists) {
                            const newOpt = new Option(fontValue.replace(/'/g, '').split(',')[0] + ' (Custom)', fontValue);
                            fontSelect.add(newOpt);
                        }
                        fontSelect.value = fontValue;
                    }
                }
            };
        }

        function sendCommand(action) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action }));
            }
        }

        function goToSlide(index) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'go_to_slide', index }));
            }
        }

        function playHistoryItem(itemStr) {
            const item = JSON.parse(decodeURIComponent(itemStr));
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'play_history_item', item }));
                toggleSettings(); // Close modal
            }
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            if (!globalHistory || globalHistory.length === 0) {
                container.innerHTML = `<div class="text-zinc-500 text-sm italic text-center mt-8">No history available</div>`;
                return;
            }

            container.innerHTML = globalHistory.map(item => {
                const safeItem = encodeURIComponent(JSON.stringify(item)).replace(/'/g, "%27");
                return `
                    <button onclick="playHistoryItem('${safeItem}')" class="w-full text-left bg-zinc-900/50 hover:bg-zinc-800 border border-zinc-800/80 p-4 rounded-xl transition-colors group">
                        <div class="font-bold text-white group-hover:text-blue-400 transition-colors">${item.reference || 'Unknown'}</div>
                        <div class="text-sm text-zinc-400 mt-2 line-clamp-2 leading-relaxed">${item.text}</div>
                    </button>
                `;
            }).join('');
        }

        function renderPlaylist(playlist, activeIndex) {
            const container = document.getElementById('playlist-container');
            if (!playlist || playlist.length === 0) {
                container.innerHTML = `<div class="text-zinc-500 text-sm italic px-1">No playlist loaded</div>`;
                return;
            }

            container.innerHTML = playlist.map((verse, index) => {
                const isActive = index === activeIndex;
                const activeClasses = isActive
                    ? 'bg-blue-900/40 border-blue-500/50 text-blue-100'
                    : 'bg-zinc-900 border-zinc-800 active:bg-zinc-800 text-zinc-300';

                let text = verse.text || '';
                text = text.replace(/^\[.*?\]\s*\n/, '').trim();

                return `
                    <button onclick="goToSlide(${index})" class="w-full text-left p-4 rounded-xl border transition-colors ${activeClasses}">
                        <div class="flex gap-3">
                            <span class="text-xs font-bold text-zinc-500 w-6 shrink-0 mt-0.5">${index + 1}</span>
                            <span class="text-sm ${isActive ? 'font-medium' : ''} leading-relaxed">${text}</span>
                        </div>
                    </button>
                `;
            }).join('');
        }

        let currentSearchType = 'song';

        function setSearchType(type) {
            currentSearchType = type;
            const songBtn = document.getElementById('search-type-song');
            const bibleBtn = document.getElementById('search-type-bible');
            const input = document.getElementById('search-input');

            if (type === 'song') {
                songBtn.className = 'flex-1 py-1.5 text-sm font-bold rounded-md bg-zinc-700 text-white shadow-sm transition-all';
                bibleBtn.className = 'flex-1 py-1.5 text-sm font-bold rounded-md text-zinc-400 hover:text-zinc-200 transition-all';
                input.placeholder = 'Search songs...';
            } else {
                bibleBtn.className = 'flex-1 py-1.5 text-sm font-bold rounded-md bg-zinc-700 text-white shadow-sm transition-all';
                songBtn.className = 'flex-1 py-1.5 text-sm font-bold rounded-md text-zinc-400 hover:text-zinc-200 transition-all';
                input.placeholder = 'Search bible (e.g. John 3:16)';
            }
            document.getElementById('search-results').innerHTML = '';
        }

        function performSearch(e) {
            e.preventDefault();
            const input = document.getElementById('search-input');
            const query = input.value.trim();
            if (query && ws && ws.readyState === WebSocket.OPEN) {
                document.getElementById('search-results').innerHTML = `<div class="text-zinc-500 text-sm italic text-center mt-8">Searching...</div>`;
                if (currentSearchType === 'song') {
                    ws.send(JSON.stringify({ action: 'search_songs', query }));
                } else {
                    ws.send(JSON.stringify({ action: 'search_verses', query }));
                }
                input.blur();
            }
        }

        function selectSong(id, title) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'select_song', id, title }));
                switchTab('live');
            }
        }

        function renderSearchResults(results) {
            const container = document.getElementById('search-results');
            if (!results || results.length === 0) {
                container.innerHTML = `<div class="text-zinc-500 text-sm italic text-center mt-8">No songs found</div>`;
                return;
            }

            container.innerHTML = results.map(song => `
                <button onclick="selectSong(${song.id}, '${song.title.replace(/'/g, "\\'")}')" 
                        class="w-full text-left bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-4 rounded-xl transition-colors group">
                    <div class="font-bold text-white group-hover:text-blue-400 transition-colors">${song.title}</div>
                    ${song.artist ? `<div class="text-sm text-zinc-500 mt-1">${song.artist}</div>` : ''}
                </button>
            `).join('');
        }

        function selectVerse(verseJson) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const verse = JSON.parse(decodeURIComponent(verseJson));
                ws.send(JSON.stringify({ action: 'select_verse', verse }));
                switchTab('live');
            }
        }

        function renderBibleResults(results) {
            const container = document.getElementById('search-results');
            if (!results || results.length === 0) {
                container.innerHTML = `<div class="text-zinc-500 text-sm italic text-center mt-8">No verses found</div>`;
                return;
            }

            container.innerHTML = results.map(verse => {
                const title = `${verse.book_name} ${verse.chapter}:${verse.verse_num}`;
                const safeVerse = encodeURIComponent(JSON.stringify(verse)).replace(/'/g, "%27");
                return `
                <button onclick="selectVerse('${safeVerse}')" 
                        class="w-full text-left bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-4 rounded-xl transition-colors group">
                    <div class="font-bold text-white group-hover:text-blue-400 transition-colors">${title}</div>
                    <div class="text-sm text-zinc-400 mt-2 line-clamp-2 leading-relaxed">${verse.text.replace(/^\[.*?\]\s*\n/, '')}</div>
                </button>
                `;
            }).join('');
        }

        connect();
        switchTab('live');
    </script>
</body>

</html>
